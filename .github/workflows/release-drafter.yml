name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  # mainへのpushで下書きリリースノートを更新する。公開は人が下書きをPublishして行う
  # (GITHUB_TOKENで作ったイベントは他のworkflowを起動しないため、自動公開しない)
  update_release_draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7

  # PRタイトルのConventional Commitsプレフィックスからラベルを付ける
  autolabeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
