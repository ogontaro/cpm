name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # .mise.tomlのbunバージョンをそのまま使う(ローカル開発と揃える)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build smoke
        run: |
          bun run build
          ./dist/cpm --version
